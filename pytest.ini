
[pytest]

# Procurar testes somente na pasta oficial do projeto.
testpaths = tests

# Informar onde estão os módulos Python da aplicação.
pythonpath = src

# Não entrar nas cópias de integração e operacionalização.
norecursedirs =
    .git
    .pytest_cache
    .venv
    .venv-*
    __pycache__
    _backup*
    _integracao
    _operacionalizacao
    build
    dist

# Exibir informações resumidas dos testes.
addopts = -ra
